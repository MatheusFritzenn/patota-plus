<section id="patota-emblema-preview" aria-label="Comparação de dois estilos de card de patota">
  <style>
    #patota-emblema-preview {
      --patota-page: light-dark(#f2fff8, #0c1b17);
      --patota-paper: light-dark(#ffffff, #182923);
      --patota-text: light-dark(#172c26, #f0fff6);
      --patota-secondary: light-dark(#687a72, #a9c0b3);
      --patota-green: light-dark(#087c4b, #43cb8b);
      --patota-green-deep: light-dark(#07633e, #126b48);
      --patota-tint: light-dark(#e8f9ef, #244533);
      --patota-line: light-dark(#dcebe1, #365246);
      --patota-crest-ground: light-dark(#fbf6e7, #35402e);
      --patota-shadow: light-dark(0 12px 26px rgba(14, 82, 51, .11), 0 12px 26px rgba(0, 0, 0, .24));
      background: var(--patota-page);
      color: var(--patota-text);
      border-radius: 20px;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    #patota-emblema-preview * { box-sizing: border-box; }
    #patota-emblema-preview .preview-heading { font-size: 22px; font-weight: 700; margin: 0 0 18px; }
    #patota-emblema-preview .preview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    #patota-emblema-preview .preview-choice { min-width: 0; }
    #patota-emblema-preview .preview-caption { color: var(--patota-secondary); font-size: 12px; font-weight: 600; margin: 0 0 9px 2px; letter-spacing: .02em; }
    #patota-emblema-preview .preview-card { display: block; overflow: hidden; min-height: 206px; color: var(--patota-text); background: var(--patota-paper); border: 1px solid var(--patota-line); border-radius: 18px; box-shadow: var(--patota-shadow); text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
    #patota-emblema-preview .preview-card:hover { transform: translateY(-3px); }
    #patota-emblema-preview .preview-card:focus-visible { outline: 3px solid var(--patota-green); outline-offset: 3px; }
    #patota-emblema-preview .compact-card { padding: 23px; border-top: 4px solid var(--patota-green); }
    #patota-emblema-preview .compact-top { display: flex; align-items: center; gap: 17px; }
    #patota-emblema-preview .crest-box { flex: none; width: 88px; height: 88px; display: grid; place-items: center; border-radius: 17px; background: var(--patota-crest-ground); border: 1px solid var(--patota-line); }
    #patota-emblema-preview .crest { width: 58px; height: 66px; display: grid; place-items: center; clip-path: polygon(9% 0, 91% 0, 100% 10%, 94% 69%, 50% 100%, 6% 69%, 0 10%); background: var(--patota-green-deep); color: #fff; font-size: 19px; font-weight: 800; letter-spacing: .02em; border-top: 7px solid #e1be66; }
    #patota-emblema-preview .team-name { font-size: 17px; font-weight: 700; line-height: 1.3; margin: 0 0 10px; }
    #patota-emblema-preview .modality { display: inline-block; width: fit-content; padding: 5px 11px; border-radius: 999px; background: var(--patota-tint); color: var(--patota-green); font-size: 12px; font-weight: 700; }
    #patota-emblema-preview .card-divider { height: 1px; background: var(--patota-line); margin: 17px 0 12px; }
    #patota-emblema-preview .address { display: flex; align-items: center; gap: 7px; color: var(--patota-secondary); font-size: 12px; line-height: 1.4; margin: 0; }
    #patota-emblema-preview .address svg { flex: none; width: 15px; height: 15px; }
    #patota-emblema-preview .cover-top { position: relative; height: 104px; background: linear-gradient(125deg, var(--patota-green-deep), var(--patota-green)); }
    #patota-emblema-preview .cover-top::after { content: ''; position: absolute; width: 140px; height: 140px; right: -39px; top: -54px; border-radius: 50%; border: 21px solid rgba(255,255,255,.12); }
    #patota-emblema-preview .cover-top::before { content: ''; position: absolute; width: 110px; height: 110px; left: 72px; bottom: -82px; border-radius: 50%; border: 16px solid rgba(255,255,255,.09); }
    #patota-emblema-preview .cover-crest { position: absolute; left: 21px; bottom: -33px; width: 74px; height: 74px; display: grid; place-items: center; border: 4px solid var(--patota-paper); background: var(--patota-crest-ground); border-radius: 16px; box-shadow: 0 5px 12px rgba(0,0,0,.13); }
    #patota-emblema-preview .cover-crest .crest { width: 46px; height: 53px; font-size: 15px; border-top-width: 5px; }
    #patota-emblema-preview .cover-body { padding: 43px 21px 20px; }
    #patota-emblema-preview .cover-body .team-name { margin-bottom: 9px; }
    #patota-emblema-preview .cover-body .address { margin-top: 12px; }
    #patota-emblema-preview .preview-choice[hidden] { display: none; }
    @media (max-width: 620px) {
      #patota-emblema-preview { padding: 18px; }
      #patota-emblema-preview .preview-grid { grid-template-columns: 1fr; }
    }
  </style>
  <h2 class="preview-heading">Cards com emblema</h2>
  <div class="preview-grid">
    <div class="preview-choice" data-choice="lateral">
      <p class="preview-caption">A · Emblema em destaque</p>
      <a class="preview-card compact-card" href="#patota-emblema-preview" aria-label="Exemplo de card lateral da patota Shaktar dos Leks">
        <div class="compact-top">
          <div class="crest-box" role="img" aria-label="Emblema ilustrativo da patota"><span class="crest" aria-hidden="true">SL</span></div>
          <div>
            <h3 class="team-name">Shaktar dos Leks</h3>
            <span class="modality">Futebol de salão</span>
          </div>
        </div>
        <div class="card-divider"></div>
        <p class="address"><i data-lucide="map-pin" aria-hidden="true"></i>Rua das Flores, 123 · São Paulo/SP</p>
      </a>
    </div>
    <div class="preview-choice" data-choice="capa">
      <p class="preview-caption">B · Faixa de identidade</p>
      <a class="preview-card cover-card" href="#patota-emblema-preview" aria-label="Exemplo de card com faixa da patota Shaktar dos Leks">
        <div class="cover-top"><div class="cover-crest" role="img" aria-label="Emblema ilustrativo da patota"><span class="crest" aria-hidden="true">SL</span></div></div>
        <div class="cover-body">
          <h3 class="team-name">Shaktar dos Leks</h3>
          <span class="modality">Futebol de salão</span>
          <p class="address"><i data-lucide="map-pin" aria-hidden="true"></i>Rua das Flores, 123 · São Paulo/SP</p>
        </div>
      </a>
    </div>
  </div>
  <script>
    const patotaPreview = document.getElementById('patota-emblema-preview');
    const patotaPreviewState = { modelo: 'comparar' };
    function renderPatotaPreview() {
      patotaPreview.querySelector('[data-choice="lateral"]').hidden = patotaPreviewState.modelo === 'capa';
      patotaPreview.querySelector('[data-choice="capa"]').hidden = patotaPreviewState.modelo === 'lateral';
      patotaPreview.querySelector('.preview-grid').style.gridTemplateColumns = patotaPreviewState.modelo === 'comparar' ? '' : 'minmax(0, 1fr)';
    }
    renderPatotaPreview();
    if (globalThis.Tweak) {
      const patotaTweak = new Tweak({ container: patotaPreview, onChange: renderPatotaPreview });
      patotaTweak.addSelect(patotaPreviewState, 'modelo', { label: 'Modelo do card', options: [
        { label: 'Comparar', value: 'comparar' },
        { label: 'A · Emblema em destaque', value: 'lateral' },
        { label: 'B · Faixa de identidade', value: 'capa' }
      ] });
    }
  </script>
</section>
